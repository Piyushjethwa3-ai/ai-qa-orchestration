[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "northstar-service-desk"
version = "0.1.0"
description = "Week 1 starter: a deterministic IT service desk API for the AI QA Orchestration program."
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.29,<1.0",
    "httpx>=0.27,<1.0",
    "jsonschema>=4.21,<5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    # Report generation used in the Day 2 lesson. pytest-metadata is a
    # transitive dependency of both and does not need declaring here.
    "pytest-html>=4.0,<5.0",
    "pytest-json-report>=1.5,<2.0",
]
# Day 3 optional live mode only. Mock mode and every test run without it.
live = [
    "openai>=3.0,<4.0",
]

[tool.setuptools.packages.find]
include = ["app*", "day3_lab*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
